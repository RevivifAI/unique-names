commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}

min_version: 1.0.0

pre-commit:
  jobs:
    - glob: "*.{js,ts,jsx,tsx}"
      name: lint
      run: pnpm lint --fix {staged_files}
      stage_fixed: true

  parallel: true
pre-push:
  jobs:
    - name: test
      run: pnpm test

    - name: typecheck
      run: pnpm tsc --noEmit
